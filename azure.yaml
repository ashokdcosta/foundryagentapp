name: foundry-agent-app

infra:
  provider: bicep
  path: infra

services:
  api:
    # PROJECT ROOT: Use ./src (not ./src/api) so both api/ and agents/ are packaged.
    # This ensures src/agents is available at runtime in /home/site/wwwroot/agents/
    project: ./src
    language: python
    host: appservice